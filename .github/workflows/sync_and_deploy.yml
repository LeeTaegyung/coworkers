name: Sync Fork and Deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # 매일 00시

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
      with:
        # 배포 브랜치 (예: master)를 체크아웃합니다.
        ref: master
        token: ${{ secrets.CW_TOKEN }}

    - name: Set up git config
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Add upstream remote
      run: git remote add upstream https://github.com/asksa1256/coworkers.git

    - name: Fetch from upstream and merge (Preferring Upstream Changes)
      run: |
        # 1. upstream/master에서 변경사항을 가져옵니다.
        git fetch upstream
        
        # 2. upstream/master를 현재 master 브랜치에 병합합니다.
        #    -X theirs 전략: 충돌 시 로컬(Fork) 변경사항보다 Upstream 변경사항을 우선합니다.
        #    --allow-unrelated-histories: 첫 동기화 시 이전에 관련 없던 히스토리를 강제로 병합 허용합니다.
        git merge upstream/master -m "Sync: Merge upstream master" --allow-unrelated-histories -X theirs

    # ❗ 이전의 'git rebase origin/master' 단계는 제거되었습니다.
    #    upstream 병합 후, rebase를 수행하면 충돌 가능성이 매우 높습니다.

    - name: Push changes to Fork repository (Force Push)
      # 배포 전용 레포지토리이므로, 동기화된 내용을 강제로 푸시합니다.
      # 이전에 발생했던 리베이스 충돌을 회피합니다.
      run: git push origin master --force

    - name: Deployment Step (Optional)
      # 여기에 실제 배포(Build, Vercel/Netlify Deploy 등) 관련 명령을 추가합니다.
      run: echo "Deployment would happen here after sync."
